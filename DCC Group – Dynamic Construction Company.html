<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DCC Group – Dynamic Construction Company, Ahmedabad</title>
<meta name="description" content="DCC Group: contractor, PMC consultant and developer in Ahmedabad since 2004.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--alt:#f5f5f5;--ink:#1f2733;--mute:#5d6878;--slate:#44546A;--yel:#FFC000;--org:#EB7D30;--line:#e2e5ea;--card:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a22;--alt:#1b232d;--ink:#eef1f5;--mute:#a4afbf;--line:#2b3644;--card:#1b232d}}
:root[data-theme="dark"]{--bg:#141a22;--alt:#1b232d;--ink:#eef1f5;--mute:#a4afbf;--line:#2b3644;--card:#1b232d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Inter,system-ui,Arial,sans-serif}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;line-height:1.15;margin:0 0 .5em}
h1{font-size:clamp(2.2rem,6vw,4rem);font-weight:800}h2{font-size:clamp(1.6rem,3.5vw,2.3rem)}h3{font-size:1.2rem}
a{color:inherit}.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;text-decoration:none}
.logo i{display:grid;place-items:center;width:34px;height:34px;background:#b5c56a;color:#2d3a10;font:800 14px "Playfair Display",serif;font-style:normal}
.links{display:flex;gap:4px}.links a{padding:8px 12px;text-decoration:none;color:var(--mute);font-weight:500;border-bottom:3px solid transparent}
.links a.on,.links a:hover{color:var(--ink);border-color:var(--org)}
#mb{display:none;background:none;border:1px solid var(--line);color:var(--ink);padding:8px 12px;font:inherit;cursor:pointer}
@media(max-width:760px){#mb{display:block}.links{display:none;position:absolute;left:0;right:0;top:64px;background:var(--bg);flex-direction:column;padding:8px 20px;border-bottom:1px solid var(--line)}.links.open{display:flex}}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--org);outline-offset:2px}
.bars{display:flex;gap:6px;margin:14px 0 22px}.bars b{height:7px;width:46px}.bars b:nth-child(1){background:var(--slate)}.bars b:nth-child(2){background:var(--yel)}.bars b:nth-child(3){background:var(--org)}
.hero{background:var(--slate);color:#fff;position:relative;overflow:hidden;padding:96px 0 88px}
.hero .wrap{position:relative;z-index:1}.hero p{max-width:540px;font-size:1.15rem;color:#e6eaf0}
.slabs{position:absolute;right:0;bottom:0;width:min(46%,460px);display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.slabs span{height:34px;background:var(--org);opacity:.95}.slabs span:nth-child(2n){background:var(--yel)}.slabs span:nth-child(3n){background:#8493a8}
@media(max-width:700px){.slabs{opacity:.25;width:70%}}
.btn{display:inline-block;padding:12px 22px;background:var(--org);color:#fff;border:0;font:600 1rem Inter,sans-serif;text-decoration:none;cursor:pointer;margin:6px 10px 6px 0}
.btn.alt{background:transparent;border:2px solid currentColor}
section{padding:64px 0}.alt{background:var(--alt)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);padding:22px;border-top:4px solid var(--org)}
.card:nth-child(3n+2){border-top-color:var(--yel)}.card:nth-child(3n){border-top-color:var(--slate)}
.card p{color:var(--mute);margin:.3em 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;text-align:center}
.stats b{display:block;font:800 2.6rem "Playfair Display",serif;color:var(--org)}
.quote{font:600 clamp(1.3rem,3vw,1.9rem)/1.3 "Playfair Display",serif;color:var(--slate);border-left:6px solid var(--yel);padding-left:18px;margin:0 0 18px}
@media(prefers-color-scheme:dark){.quote{color:#c9d3e2}}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}.tabs button{padding:8px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 .95rem Inter,sans-serif;cursor:pointer}
.tabs button.on{background:var(--slate);color:#fff;border-color:var(--slate)}
.tag{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 10px;color:#1f2733;background:var(--yel)}
.tag.Running{background:var(--org);color:#fff}.tag.Upcoming{background:var(--slate);color:#fff}
.meta{font-size:.9rem;color:var(--mute);margin:.5em 0}
.card button{margin-top:10px;background:none;border:0;color:var(--org);font:600 .95rem Inter,sans-serif;cursor:pointer;padding:0}
dialog{max-width:520px;width:calc(100% - 32px);border:0;padding:28px;background:var(--bg);color:var(--ink);border-top:6px solid var(--org)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.steps{display:flex;flex-wrap:wrap;gap:10px;counter-reset:s;padding:0;list-style:none}
.steps li{flex:1 1 150px;background:var(--card);border:1px solid var(--line);padding:16px;counter-increment:s;font-weight:600}
.steps li:before{content:counter(s);display:block;font:800 1.6rem "Playfair Display",serif;color:var(--org)}
.two{display:grid;gap:32px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
form label{display:block;font-weight:500;margin-top:14px}
input,select,textarea{width:100%;padding:11px;margin-top:4px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.hp{position:absolute;left:-9999px}
#msg{margin-top:14px;font-weight:500}.err{color:#c0392b}.ok{color:#2e8b57}
.ck{list-style:none;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.ck li:before{content:"\2713";color:#fff;background:var(--org);display:inline-block;width:22px;height:22px;text-align:center;margin-right:10px;line-height:22px}
footer{background:var(--slate);color:#e6eaf0;padding:40px 0 28px;font-size:.95rem}
footer a{text-decoration:none;margin-right:14px}footer .wrap{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between}
@media(prefers-reduced-motion:no-preference){.hero h1{animation:up .7s ease both}@keyframes up{from{opacity:0;transform:translateY(14px)}}}
</style>
</head>
<body>
<header><div class="wrap"><nav>
<a class="logo" href="#/"><i>DC</i><span>DCC Group</span></a>
<button id="mb" aria-label="Menu" aria-expanded="false">Menu</button>
<div class="links" id="links"></div></nav></div></header>
<main id="app"></main>
<footer><div class="wrap">
<div><b>Dynamic Construction Company</b><br>Contractor · PMC · Developer<br>Ahmedabad, Gujarat</div>
<div id="fl"></div>
<div id="fc"></div></div>
<div class="wrap" style="margin-top:20px"><span>© DCC Group. All rights reserved.</span></div></footer>
<dialog id="dlg"></dialog>
<script>
var CO={phone:"+91 00000 00000",email:"info@dccgroup.example",address:"Ahmedabad, Gujarat, India",hours:"Mon–Sat, 10:00 am – 6:00 pm"};
var NAV=[["","Home"],["about","About"],["services","Services"],["projects","Projects"],["contact","Contact"]];
var P=[
["Ambience Park","Completed","Contractor","Off C.G. Road, near Shambhoo Coffee Bar, H.L. College","~40,000 sq.ft","Basement + 5 floors","Turnkey project of 3 BHK luxury flats, delivered on time. The basement is 16 ft high to fit hydraulic parking."],
["Manor Imperia","Completed","Contractor","Satellite, Ahmedabad","~50,000 sq.ft","G-1, G+7","Turnkey contract plus PMC consultancy and sales support. Hydraulic parking, duplex penthouses on the 6th and 7th floors, gymnasium, club house and a terrace garden with pantry and gazebo."],
["Ambience Park 2 (Ambience Commercial)","Completed","Contractor","Near Vijay Cross Road","~35,000 sq.ft","G-2, G+7","Turnkey and barter project with PT beams in every slab, showrooms on the ground floor and offices of 1,000+ sq.ft above. Frame completed in 8 months."],
["Ambience Aaryan","Completed","Contractor","Navrangpura","~40,000 sq.ft","G-1, G+5","Turnkey plus PMC. 3 BHK luxury flats, gymnasium, club house and a terrace garden with pantry and gazebo."],
["Shanti Junior School","Completed","Contractor","Koteshwar","~22,000 sq.ft","G+1","Turnkey school building completed in just 4 months, our fastest project ever."],
["Manor Maxx","Completed","Contractor","Near H.L. College Road","~35,000 sq.ft","-2, G+7","Commercial building with PT beams in every slab, ground-floor showrooms and offices above. Frame completed in 10 months."],
["Avion Commercial","Completed","Contractor","Near Sardar Bawla Cross Road, Naranpura","~31,000 sq.ft","-1, G+6","Commercial building with PT beams, showrooms and offices. Frame completed in 1.5 years."],
["Aaradhana Residency 1","Completed","Developer","Bareja, Kheda","~42,000 sq.ft","5 floors, 2 blocks","2 BHK residential project, completed in 2014."],
["Aaradhana Residency and Commercial","Completed","Developer","Bareja, Kheda","~38,000 sq.ft","G+5","2 BHK flats with ground-floor parking and a club house. 2015–2017."],
["Nilkanth Homes","Completed","Developer","Chandkheda, Ahmedabad","26 houses","Bungalows","26 raw houses of 3 BHK, handed over lock and key within 10 months. Started 2018."],
["Sahajanand Homes","Completed","Developer","Jetalpur","42 houses","Duplex","42 duplex raw houses of 3 BHK, 2016–2018."],
["Shiv Bungalows","Completed","Developer","Navrangpura","4 bungalows","G-1 & G+3","Four 5 BHK bungalows built to client requirements. Earthquake-resistant structure, vitrified flooring, granite kitchen platform, ISI copper wiring, modular accessories, AC points in all bedrooms and branded bath fittings."],
["Sargasan Project","Running","Contractor","Sargasan, Gandhinagar","~150,000 sq.ft","Basement + G+12","3 BHK flats and showrooms."],
["Seven Ambience","Running","Contractor","Ishwar Bhuvan Road, Navrangpura","~25,000 sq.ft","Basement + G+7","3 BHK flats with 16 ft hydraulic parking."],
["7 Stone","Running","Contractor","Navjeevan Press Road, Ashram Road","~15,000 sq.ft","Basement + G+7","3 BHK flats with 14 ft hydraulic parking."],
["Riseonic Namoh","Running","Contractor","Near Arham Park, Sabarmati","~400,000 sq.ft","-2, G+10","2 and 3 BHK flats with hydraulic parking."],
["T-Green (Ratna Developers)","Running","Contractor","Shela, near Club O7","~478,000 sq.ft","-2, G+14","Turnkey project of 3 BHK flats with hydraulic parking."],
["Vandita","Running","Contractor","Paldi, Ahmedabad","~60,000 sq.ft","-1, G+7","3 BHK flats with hydraulic parking."],
["The Riesonic (Riesonic Buildcon)","Upcoming","Contractor","Vande Mataram Road, Ahmedabad","~380,000 sq.ft","-2, G+14 + G+3 commercial","3 BHK flats and a commercial block with hydraulic parking."]];
var S=[["Residential Building Projects","Apartments, 2 and 3 BHK flats, raw houses and bungalows, with club house, gymnasium, terrace garden, pantry and gazebo."],
["Commercial Building Projects","Offices and showrooms with PT beams in slabs and double-height basements."],
["Barter Projects","We build on a barter basis with land owners."],
["PMC Consulting","Project management consultancy: construction supervision and sales support for the client."],
["Turnkey Projects","Complete delivery from construction to lock-and-key handover."],
["Industrial Constructions","Industrial and institutional buildings. Shanti Junior School, 22,000 sq.ft, was ready in 4 months."]];
var $=function(s){return document.querySelector(s)};
function bars(){return '<div class="bars"><b></b><b></b><b></b></div>'}
function cta(){return '<section class="alt"><div class="wrap"><h2>Ready to start your next project?</h2>'+bars()+'<a class="btn" href="#/contact">Contact us</a></div></section>'}
function pcard(p,i){return '<article class="card"><span class="tag '+p[1]+'">'+p[1]+'</span> <span class="meta">· '+p[2]+'</span><h3>'+p[0]+'</h3><div class="meta">'+p[3]+'<br>'+p[4]+' · '+p[5]+'</div><button data-i="'+i+'">View details</button></article>'}
function scards(n){return S.slice(0,n||6).map(function(s){return '<div class="card"><h3>'+s[0]+'</h3><p>'+s[1]+'</p></div>'}).join('')}
var V={
"":function(){return '<div class="hero"><div class="slabs" aria-hidden="true"><span style="width:100%"></span><span style="width:84%"></span><span style="width:68%"></span><span style="width:52%"></span><span style="width:36%"></span></div><div class="wrap"><h1>You dream it.<br>We build it.</h1><p>Excellence in contracting, since 2004. Residential, commercial and industrial buildings across Ahmedabad.</p><a class="btn" href="#/projects">View our projects</a><a class="btn alt" href="#/contact">Contact us</a></div></div>'+
'<section><div class="wrap"><h2>Dynamic Construction Company</h2>'+bars()+'<p style="max-width:720px">DCC Group gives its customers excellence in contracting: consistent, high-quality, cost-effective results. We are a well-respected, privately held family firm founded in 2004, and we work with zero quality compromises.</p></div></section>'+
'<section class="alt"><div class="wrap stats"><div><b>2004</b>Founded</div><div><b>19</b>Projects</div><div><b>4 months</b>Fastest delivery</div><div><b>3</b>Roles: contractor, PMC, developer</div></div></section>'+
'<section><div class="wrap"><h2>What we do</h2>'+bars()+'<div class="grid">'+scards()+'</div><p><a class="btn" href="#/services">All services</a></p></div></section>'+
'<section class="alt"><div class="wrap"><h2>Featured projects</h2>'+bars()+'<div class="grid">'+[0,1,16].map(function(i){return pcard(P[i],i)}).join('')+'</div></div></section>'+
'<section><div class="wrap"><h2>Our fastest project</h2>'+bars()+'<p style="max-width:720px"><b>Shanti Junior School, Koteshwar:</b> 22,000 sq.ft built in just 4 months.</p></div></section>'+
'<section class="alt"><div class="wrap"><p class="quote">Our reputation is as solid as concrete.</p><p class="quote">Committed to superior quality and results.</p><p class="quote">You dream it. We build it.</p></div></section>'+cta()},
"about":function(){return '<section><div class="wrap"><h1>About DCC Group</h1>'+bars()+'<p style="max-width:720px">Dynamic Construction Group is a well-respected, privately held family contracting firm founded in 2004. We work with zero quality compromises.</p><p style="max-width:720px">With a strong equipment fleet and virtually unlimited bonding capacity, we serve the public and private sectors with a wide range of contracting services. Our production team works closely with safety, quality control and environmental departments to bring projects in on time and within budget, meeting or exceeding all quality specifications and regulations.</p></div></section>'+
'<section class="alt"><div class="wrap"><h2>Why choose us</h2>'+bars()+'<div class="grid">'+[["Zero quality compromises","Every project is built to meet or exceed specification."],["On-time delivery","Ambience Park was finished on time, and Shanti Junior School in 4 months."],["Cost-effective results","Consistent quality within budget."],["Turnkey and PMC expertise","From construction to lock and key, with consultancy and sales support."],["Experienced team","Production, safety and quality teams working together."],["Client satisfaction","Our clients are satisfied with our work and completion time."]].map(function(c){return '<div class="card"><h3>'+c[0]+'</h3><p>'+c[1]+'</p></div>'}).join('')+'</div></div></section>'+
'<section><div class="wrap"><h2>Our two roles</h2>'+bars()+'<div class="grid"><div class="card"><h3>Contractor</h3><p>We construct for clients, on turnkey, barter and PMC terms.</p></div><div class="card"><h3>Developer</h3><p>Our own projects: Aaradhana Residency, Nilkanth Homes, Sahajanand Homes and Shiv Bungalows.</p></div></div></div></section>'+
'<section class="alt"><div class="wrap"><h2>Licenses and documentation</h2>'+bars()+'<p>We hold every license required for development and construction.</p><ul class="ck"><li>Developer license</li><li>Labor license</li><li>Contractor license</li><li>Clerk of Works badge</li><li>Engineer license and certificates</li><li>All other documents</li></ul></div></section>'+cta()},
"services":function(){return '<section><div class="wrap"><h1>Services</h1>'+bars()+'<div class="grid">'+S.map(function(s){return '<div class="card"><h3>'+s[0]+'</h3><p>'+s[1]+'</p><p><a href="#/contact" style="color:var(--org);font-weight:600">Get a quote</a></p></div>'}).join('')+'</div></div></section>'+
'<section class="alt"><div class="wrap"><h2>Our process</h2>'+bars()+'<ol class="steps"><li>Consultation</li><li>Planning and design</li><li>Construction</li><li>Quality check</li><li>Handover</li></ol></div></section>'+cta()},
"projects":function(){return '<section><div class="wrap"><h1>Projects</h1>'+bars()+'<p class="quote">Our reputation is as solid as concrete.</p><div class="tabs" id="tabs"></div><div class="grid" id="pg"></div></div></section>'},
"contact":function(){return '<section><div class="wrap two"><div><h1>Contact us</h1>'+bars()+'<p><b>Address</b><br>'+CO.address+'</p><p><b>Phone</b><br>'+CO.phone+'</p><p><b>Email</b><br>'+CO.email+'</p><p><b>Hours</b><br>'+CO.hours+'</p><p class="meta">Replace these placeholder details in the CO object at the top of the script.</p></div>'+
'<form id="cf" novalidate><label>Full name<input name="user_name" required></label><label>Email<input name="user_email" type="email" required></label><label>Phone (10 digits)<input name="user_phone" inputmode="numeric" required></label><label>Project type<select name="project_type"><option>Residential</option><option>Commercial</option><option>Barter</option><option>PMC Consulting</option><option>Turnkey</option><option>Industrial</option><option>Other</option></select></label><label>Message<textarea name="message" rows="5" required></textarea></label><input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><button class="btn" style="margin-top:16px">Send enquiry</button><div id="msg" role="status"></div></form></div></section>'}};
var F="All";
function drawProjects(){var T=["All","Completed","Running","Upcoming","As Developer"];
$("#tabs").innerHTML=T.map(function(t){return '<button class="'+(t==F?"on":"")+'" data-f="'+t+'">'+t+'</button>'}).join('');
$("#pg").innerHTML=P.map(function(p,i){return [p,i]}).filter(function(x){var p=x[0];return F=="All"||(F=="As Developer"?p[2]=="Developer":p[1]==F)}).map(function(x){return pcard(x[0],x[1])}).join('')}
function route(){var h=(location.hash.replace(/^#\/?/,"")||"");if(!V[h])h="";
$("#app").innerHTML=V[h]();$("#links").classList.remove("open");$("#mb").setAttribute("aria-expanded","false");
$("#links").innerHTML=NAV.map(function(n){return '<a href="#/'+n[0]+'" class="'+(n[0]==h?"on":"")+'">'+n[1]+'</a>'}).join('');
document.title=(h?NAV.filter(function(n){return n[0]==h})[0][1]+" – ":"")+"DCC Group";window.scrollTo(0,0);
if(h=="projects")drawProjects();
if(h=="contact")$("#cf").addEventListener("submit",send)}
function send(e){e.preventDefault();var f=e.target,m=$("#msg"),d=new FormData(f);m.className="";
if(d.get("website"))return;
var n=d.get("user_name").trim(),em=d.get("user_email").trim(),ph=d.get("user_phone").replace(/\D/g,""),ms=d.get("message").trim();
if(!n||!/^\S+@\S+\.\S+$/.test(em)||ph.length!=10||!ms){m.className="err";m.textContent="Enter your name, a valid email, a 10-digit phone number and a message.";return}
var body="Name: "+n+"\nEmail: "+em+"\nPhone: "+ph+"\nProject type: "+d.get("project_type")+"\n\n"+ms;
location.href="mailto:"+CO.email+"?subject="+encodeURIComponent("Website enquiry: "+d.get("project_type"))+"&body="+encodeURIComponent(body);
m.className="ok";m.textContent="Your email app should open with the enquiry filled in. Press send there to reach us.";f.reset()}
document.addEventListener("click",function(e){var t=e.target;
if(t.dataset.f){F=t.dataset.f;drawProjects()}
if(t.dataset.i){var p=P[t.dataset.i],d=$("#dlg");d.innerHTML='<span class="tag '+p[1]+'">'+p[1]+'</span> <span class="meta">· '+p[2]+'</span><h2>'+p[0]+'</h2><p>'+p[6]+'</p><p class="meta"><b>Location:</b> '+p[3]+'<br><b>Area:</b> '+p[4]+'<br><b>Floors:</b> '+p[5]+'</p><button class="btn" id="cl">Close</button>';d.showModal()}
if(t.id=="cl")$("#dlg").close();if(t.id=="dlg")t.close();
if(t.id=="mb"){var o=$("#links").classList.toggle("open");t.setAttribute("aria-expanded",o)}});
$("#fl").innerHTML=NAV.map(function(n){return '<a href="#/'+n[0]+'">'+n[1]+'</a>'}).join('');
$("#fc").innerHTML=CO.phone+'<br>'+CO.email;
addEventListener("hashchange",route);route();
</script>
</body>
</html>
